<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="linksy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- preload only the two main faces: Plus Jakarta Sans 800 (display) and Inter Tight 400 (body) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_KUn9TR_V.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/intertight/v9/NGSnv5HMAFg6IuGlBNMjxJEL2VmU3NS7Z2mjDw-aWy5S.woff2" />
    <!-- non-blocking stylesheet: paints immediately with fallback fonts, swaps in when loaded (display=swap) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600&display=swap" /></noscript>
    <meta name="description" content="linksy. Gaming accounts, social media accounts and gift cards. Naira pricing, bank transfer checkout." />
    <link rel="preconnect" href="https://wa.me" />
    <title>linksy. Gaming accounts, socials and gift cards</title>
    <style>
      /* instant splash: inline, no external requests. removed by the app on mount (main.jsx) or by the failsafe below. */
      #splash{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#ffffff;transition:opacity .25s ease,visibility .25s ease}
      #splash.is-gone{opacity:0;visibility:hidden;pointer-events:none}
      #splash .sp-mark{width:56px;height:56px}
      #splash .sp-word{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em;color:#0b0d0c;line-height:1}
      #splash .sp-dot{width:10px;height:10px;border-radius:50%;background:#84cc16;margin-top:18px;animation:sp-pulse 1s ease-in-out infinite}
      @keyframes sp-pulse{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1.15);opacity:1}}
      @media (prefers-reduced-motion: reduce){#splash .sp-dot{animation:none;opacity:.8;transform:none}}
    </style>
    <script>
      // failsafe: never leave the splash up for more than 2.5s, even if the app bundle stalls
      setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('is-gone');setTimeout(function(){s.remove()},300)}},2500);
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading linksy">
      <svg class="sp-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
        <defs>
          <linearGradient id="sps" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ecfccb" />
            <stop offset="1" stop-color="#d9f99d" />
          </linearGradient>
        </defs>
        <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#sps)" />
        <rect x="1" y="1" width="30" height="15" rx="9" fill="#ffffff" fill-opacity="0.22" />
        <path d="M11 7h4.2v12.6H23V24H11z" fill="#0b0d0c" />
      </svg>
      <span class="sp-word">linksy</span>
      <span class="sp-dot" aria-hidden="true"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
