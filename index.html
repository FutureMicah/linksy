<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="linksy" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- preload only the two main faces: Plus Jakarta Sans 800 (display) and Inter Tight 400 (body) -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_KUn9TR_V.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="https://fonts.gstatic.com/s/intertight/v9/NGSnv5HMAFg6IuGlBNMjxJEL2VmU3NS7Z2mjDw-aWy5S.woff2" />
    <!-- non-blocking stylesheet: paints immediately with fallback fonts, swaps in when loaded (display=swap) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter+Tight:wght@400;500;600&display=swap" /></noscript>
    <meta name="description" content="linksy. Gaming accounts, social media accounts and gift cards. Naira pricing, bank transfer checkout." />
    <link rel="preconnect" href="https://wa.me" />
    <title>linksy. Gaming accounts, socials and gift cards</title>
    <style>
      /* 3D gamepad loader: pure CSS, inline, no requests. held by main.jsx until the app is ready. */
      #splash{position:fixed;inset:0;z-index:2147483647;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:#ffffff;transition:opacity .3s ease,visibility .3s ease;overflow:hidden}
      #splash.is-gone{opacity:0;visibility:hidden;pointer-events:none}
      #splash .gp-scene{width:220px;height:170px;perspective:700px;perspective-origin:50% 40%;display:flex;align-items:center;justify-content:center}
      #splash .gp-pad{position:relative;width:170px;height:104px;transform-style:preserve-3d;animation:gp-spin 7s ease-in-out infinite;will-change:transform}
      #splash .gp-layer,#splash .gp-face{position:absolute;inset:0;border-radius:52px 52px 58px 58px}
      #splash .gp-layer{background:linear-gradient(180deg,#84cc16,#65a30d);transform:translateZ(calc(var(--i) * -3px))}
      #splash .gp-face{background:linear-gradient(160deg,#ffffff 0%,#f7fee7 55%,#ecfccb 100%);box-shadow:inset 0 -6px 0 rgba(101,163,13,.25),inset 0 2px 0 #fff;transform:translateZ(0)}
      #splash .gp-grip{position:absolute;bottom:-30px;width:50px;height:58px;border-radius:0 0 28px 28px;background:linear-gradient(180deg,#ecfccb,#d9f99d);box-shadow:inset 0 -4px 0 rgba(101,163,13,.3)}
      #splash .gp-grip.l{left:18px;transform:rotate(12deg);transform-origin:top center}
      #splash .gp-grip.r{right:18px;transform:rotate(-12deg);transform-origin:top center}
      #splash .gp-dpad{position:absolute;left:26px;top:36px;width:38px;height:38px}
      #splash .gp-dpad::before,#splash .gp-dpad::after{content:"";position:absolute;background:#0b0d0c;border-radius:4px}
      #splash .gp-dpad::before{left:13px;top:0;width:12px;height:38px}
      #splash .gp-dpad::after{top:13px;left:0;height:12px;width:38px}
      #splash .gp-btn{position:absolute;width:18px;height:18px;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);animation:gp-boot 2.4s ease-in-out infinite}
      #splash .gp-btn.y{left:112px;top:12px;background:#fef9c3;--g:#fde047;animation-delay:0s}
      #splash .gp-btn.x{left:94px;top:32px;background:#d9f99d;--g:#bef264;animation-delay:.6s}
      #splash .gp-btn.a{left:112px;top:52px;background:#a3e635;--g:#84cc16;animation-delay:1.2s}
      #splash .gp-btn.b{left:130px;top:32px;background:#bef264;--g:#a3e635;animation-delay:1.8s}
      #splash .gp-pill{position:absolute;top:44px;width:14px;height:5px;border-radius:3px;background:#65a30d;opacity:.7}
      #splash .gp-pill.s{left:71px}
      #splash .gp-pill.t{left:87px}
      #splash .sp-word{margin-top:6px;font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:800;font-size:28px;letter-spacing:.04em;line-height:1;color:#0b0d0c;background:linear-gradient(100deg,#0b0d0c 35%,#65a30d 50%,#0b0d0c 65%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:gp-shine 2.8s linear infinite}
      #splash .sp-cap{margin-top:10px;font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:12px;letter-spacing:.06em;color:#4d5a2e}
      #splash .sp-retry{display:none;margin-top:14px;font:600 13px/1 "Inter Tight",system-ui,sans-serif;color:#0b0d0c;background:#a3e635;border:0;border-radius:999px;padding:10px 18px;cursor:pointer}
      #splash.is-stuck .sp-cap{display:none}
      #splash.is-stuck .sp-retry{display:inline-block}
      @keyframes gp-spin{0%,100%{transform:rotateX(12deg) rotateY(-26deg)}50%{transform:rotateX(-6deg) rotateY(26deg)}}
      @keyframes gp-boot{0%,100%{transform:scale(1);filter:brightness(.85);box-shadow:none}10%{transform:scale(1.25);filter:brightness(1.25);box-shadow:0 0 14px 4px var(--g)}24%{transform:scale(1);filter:brightness(1)}}
      @keyframes gp-shine{0%{background-position:120% 0}100%{background-position:-120% 0}}
      @media (prefers-reduced-motion: reduce){
        #splash .gp-pad,#splash .gp-btn,#splash .sp-word{animation:none}
        #splash .gp-pad{transform:rotateX(12deg) rotateY(-18deg)}
      }
    </style>
    <script>
      // failsafe: never white-screen. the splash only ever leaves via main.jsx once the app is ready.
      // after 12s with no ready signal, show a tap-to-retry state instead of hiding the splash.
      // the retry state only shows if React never mounted at all (a real error). a mounted app reveals itself in main.jsx.
      setTimeout(function(){var r=document.getElementById('root');if(r&&r.childElementCount>0)return;var s=document.getElementById('splash');if(s){s.classList.add('is-stuck');var b=s.querySelector('.sp-retry');if(b)b.onclick=function(){location.reload()}}},12000);
    </script>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading linksy">
      <div class="gp-scene" aria-hidden="true">
        <div class="gp-pad">
          <i class="gp-layer" style="--i:1"></i>
          <i class="gp-layer" style="--i:2"></i>
          <i class="gp-layer" style="--i:3"></i>
          <i class="gp-layer" style="--i:4"></i>
          <div class="gp-face">
            <i class="gp-grip l"></i>
            <i class="gp-grip r"></i>
            <i class="gp-dpad"></i>
            <i class="gp-pill s"></i>
            <i class="gp-pill t"></i>
            <i class="gp-btn y"></i>
            <i class="gp-btn x"></i>
            <i class="gp-btn a"></i>
            <i class="gp-btn b"></i>
          </div>
        </div>
      </div>
      <span class="sp-word">linksy</span>
      <span class="sp-cap">loading your game…</span>
      <button class="sp-retry" type="button">still loading… tap to retry</button>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
